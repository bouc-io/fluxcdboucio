---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opentelemetry-helmrepo
  namespace: opentelemetry
spec:
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
  interval: 30m
  timeout: 1m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator-helmrelease
  namespace: opentelemetry
spec:
  releaseName: opentelemetry-operator
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-operator
      # Adjust to your desired operator version range
      version: "0.99.0"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry-helmrepo
        namespace: opentelemetry
      interval: 30m
  install:
    crds: Create
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  targetNamespace: opentelemetry
  valuesFrom:
    - kind: ConfigMap
      name: opentelemetry-base-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: opentelemetry-level-values
      valuesKey: values.yaml
