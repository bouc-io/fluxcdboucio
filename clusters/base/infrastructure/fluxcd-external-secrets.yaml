---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets-helmrepo
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-helmrelease
  namespace: external-secrets
spec:
  suspend: false
  interval: 240m
  releaseName: external-secrets
  install:
    crds: Create
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: external-secrets
      # Verified against chart 2.7.0 (appVersion v2.7.0). "2.x" stays within the
      # current major; pin exactly (e.g. "2.7.0") if you want fully reproducible
      # reconciles.
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: external-secrets-helmrepo
        namespace: external-secrets
      interval: 12h
  # Per-environment overlays override valuesFrom (base + level ConfigMaps).
  valuesFrom:
    - kind: ConfigMap
      name: external-secrets-base-values
      valuesKey: base.values.yaml
      optional: false
