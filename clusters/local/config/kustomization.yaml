  - name: grafana-level-values
    namespace: grafana
    files:
      - lcl.values.yaml=../../components/grafana/lcl.values.yaml
  # Grafana dashboards: ConfigMaps imported by the Grafana sidecar (label grafana_dashboard).
  # substitute:disabled excludes them from Flux postBuild — dashboard JSON is full of ${...}
  # Grafana template vars (${datasource}, ${DS_PROMETHEUS}, $__rate_interval, …). Same approach
  # as keycloak-users-realm. Grouped so no ConfigMap nears the ~1 MB object limit.
  - name: grafana-dashboards-k8s-views
    namespace: grafana
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: "disabled"
    files:
      - k8s-views-global.json=../../components/grafana/dashboards/base/k8s-views-global.json
      - k8s-views-namespaces.json=../../components/grafana/dashboards/base/k8s-views-namespaces.json
      - k8s-views-nodes.json=../../components/grafana/dashboards/base/k8s-views-nodes.json
      - k8s-views-pods.json=../../components/grafana/dashboards/base/k8s-views-pods.json
  - name: grafana-dashboards-k8s-addons
    namespace: grafana
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: "disabled"
    files:
      - k8s-addons-prometheus.json=../../components/grafana/dashboards/base/k8s-addons-prometheus.json
      - k8s-addons-trivy-operator.json=../../components/grafana/dashboards/base/k8s-addons-trivy-operator.json
  - name: grafana-dashboards-k8s-system
    namespace: grafana
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: "disabled"
    files:
      - k8s-system-api-server.json=../../components/grafana/dashboards/base/k8s-system-api-server.json
      - k8s-system-coredns.json=../../components/grafana/dashboards/base/k8s-system-coredns.json
  - name: grafana-dashboards-istio
    namespace: grafana
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: "disabled"
    files:
      - 7636_rev309.json=../../components/grafana/dashboards/base/7636_rev309.json
      - 7639_rev310.json=../../components/grafana/dashboards/base/7639_rev310.json
      - 7645_rev309.json=../../components/grafana/dashboards/base/7645_rev309.json
      - 11829_rev309.json=../../components/grafana/dashboards/base/11829_rev309.json
  - name: grafana-dashboards-extra
    namespace: grafana
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: "disabled"
    files:
      - 12740_rev1.json=../../components/grafana/dashboards/base/12740_rev1.json
  # App-observability dashboards: business metrics (agent_*/distiller_*, direct-scrape)
  # and OTLP-routed runtime/HTTP (otel_*). Source JSON lives in the grafana component.
  - name: grafana-dashboards-app
    namespace: grafana
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: "disabled"
    files:
      - boucio-app-business.json=../../components/grafana/dashboards/base/boucio-app-business.json
      - boucio-app-runtime.json=../../components/grafana/dashboards/base/boucio-app-runtime.json
