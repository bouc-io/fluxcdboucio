apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-eso-externalsecrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/components/external-secrets/externalsecrets/local
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: local-infra
    - name: local-eso-stores
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets-helmrelease
      namespace: external-secrets
