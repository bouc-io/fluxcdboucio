apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-eso-infra-externalsecrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/components/external-secrets/externalsecrets/infra/local
  prune: true
  # Deliberately wait:false, and NOTHING dependsOn this Kustomization.
  # These are add-on credentials (Datadog, Keycloak clients, oauth2-proxy Redis).
  # The app DB secrets live in the sibling local-eso-externalsecrets, which apps
  # DO gate on with wait:true. Keeping them apart means a missing Datadog key
  # degrades Datadog only, instead of blocking every application from deploying.
  # Sync status is visible with: kubectl get externalsecret -A
  wait: false
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: local-infra
    - name: local-eso-stores
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets-helmrelease
      namespace: external-secrets
