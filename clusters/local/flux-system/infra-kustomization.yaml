apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-infra
  namespace: flux-system
spec:
  interval: 1m
  path: "./clusters/local/infrastructure"
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  timeout: 10m
  # THIS IS THE KEY - Apps depend on config
  dependsOn:
    - name: local-config

  # Post-build variable substitution
  postBuild:
    substitute:
      CONFIG_TIMESTAMP: "$(date +%Y%m%d-%H%M%S)"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: true
      - kind: ConfigMap
        name: datadog-base-values
        optional: true
      - kind: ConfigMap
        name: datadog-level-values
        optional: true
      - kind: ConfigMap
        name: opentelemetry-base-values
        optional: true
      - kind: ConfigMap
        name: opentelemetry-level-values
        optional: true
      - kind: ConfigMap
        name: keycloak-base-values
        optional: true
      - kind: ConfigMap
        name: keycloak-level-values
        optional: true
      - kind: ConfigMap
        name: keycloak-users-realm
        optional: true
      - kind: ConfigMap
        name: oauth2-proxy-base-values
        optional: true
      - kind: ConfigMap
        name: oauth2-proxy-level-values
        optional: true
      - kind: ConfigMap
        name: external-dns-base-values
        optional: true
      - kind: ConfigMap
        name: external-dns-level-values
        optional: true
      - kind: ConfigMap
        name: external-secrets-base-values
        optional: true
      - kind: ConfigMap
        name: external-secrets-level-values
        optional: true
