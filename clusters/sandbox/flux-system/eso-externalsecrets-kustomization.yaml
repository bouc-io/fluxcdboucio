apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sandbox-eso-externalsecrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/components/external-secrets/externalsecrets/sandbox
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sandbox-infra
    - name: sandbox-eso-stores
    # The five DB passwords and the agent Redis password are created in GCP
    # Secret Manager by the PushSecrets in that Kustomization. Reading them
    # before they exist would just fail and retry, but the ordering makes the
    # first reconcile clean.
    - name: sandbox-eso-generators
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets-helmrelease
      namespace: external-secrets
