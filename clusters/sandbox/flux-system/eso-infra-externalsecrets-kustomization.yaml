apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sandbox-eso-infra-externalsecrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/components/external-secrets/externalsecrets/infra/sandbox
  prune: true
  # Deliberately wait:false, and NOTHING dependsOn this Kustomization.
  # These are add-on credentials (Datadog, Keycloak clients, oauth2-proxy Redis).
  # The app DB secrets live in the sibling sandbox-eso-externalsecrets, which apps
  # DO gate on with wait:true. Keeping them apart means a missing Datadog key
  # degrades Datadog only, instead of blocking every application from deploying.
  # Sync status is visible with: kubectl get externalsecret -A
  wait: false
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Deliberately NOT dependsOn sandbox-eso-generators, even though the
  # oauth2-proxy Redis password in this set is generated rather than hand-created.
  # Depending on it would undo the whole point of the comment above: a generator
  # or IAM problem would then also block the Datadog key, which has nothing to do
  # with generation. The ExternalSecret simply retries until its PushSecret lands
  # the value in Secret Manager, and self-heals with no ordering guarantee needed.
  # The sibling sandbox-eso-externalsecrets DOES depend on the generators, because
  # apps gate on it and a missing DB password there is a genuine blocker.
  dependsOn:
    - name: sandbox-infra
    - name: sandbox-eso-stores
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets-helmrelease
      namespace: external-secrets
