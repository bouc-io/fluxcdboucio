apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sandbox-eso-stores
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/components/external-secrets/stores/sandbox
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sandbox-infra
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets-helmrelease
      namespace: external-secrets
  # The gcpsm ClusterSecretStore references ${GCP_PROJECT_ID}; resolve it from
  # the cluster-vars ConfigMap (must contain GCP_PROJECT_ID — see fluxcd README).
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
