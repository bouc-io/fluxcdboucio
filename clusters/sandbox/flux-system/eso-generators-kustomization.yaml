apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sandbox-eso-generators
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/components/external-secrets/generators/sandbox
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Sequenced between the store and the ExternalSecrets: the PushSecrets need the
  # ClusterSecretStore to exist before they can write, and the ExternalSecrets
  # need the GCP secrets to exist before they can read. Both ExternalSecret
  # Kustomizations therefore dependsOn this one.
  dependsOn:
    - name: sandbox-infra
    - name: sandbox-eso-stores
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets-helmrelease
      namespace: external-secrets
  # No postBuild.substituteFrom here: unlike the ClusterSecretStore, none of the
  # generator or PushSecret manifests reference ${GCP_PROJECT_ID}.
