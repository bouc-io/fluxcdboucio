# Single owner for every namespace in the cluster.
#
# These namespaces used to be declared twice: here (applied by the <env>-config
# Kustomization) and again inline at the top of each
# clusters/base/infrastructure/fluxcd-<x>.yaml (applied by <env>-infra). Both run on a 1m
# interval, so they overwrote each other's kustomize.toolkit.fluxcd.io/name ownership
# label on every reconcile. This file is now the only declaration.
#
# The prune: disabled annotation is deliberate and permanent. Deleting a namespace takes
# every workload inside it with it, so Flux garbage collection must never do it silently.
# Trade-off: removing an entry below no longer removes the namespace from the cluster,
# that is now a deliberate manual step.
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    config-managed-by: flux
    toolkit.fluxcd.io/tenant: sre-team
    istio-injection: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
