apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datadog-agent-helmrelease
  namespace: datadog
  annotations:
    config-updated: "${CONFIG_TIMESTAMP}"
spec:
  interval: 240m # Shorter interval for local development
  valuesFrom:
    - kind: ConfigMap
      name: datadog-base-values
      valuesKey: base.values.yaml
    - kind: ConfigMap
      name: datadog-level-values
      valuesKey: snbx.values.yaml
  values:
    replicaCount: 1 # Single replica for local
