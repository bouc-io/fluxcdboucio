apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-helmrelease
  namespace: grafana
  annotations:
    config-updated: "${CONFIG_TIMESTAMP}"
spec:
  valuesFrom:
    - kind: ConfigMap
      name: grafana-base-values
      valuesKey: base.values.yaml
    - kind: ConfigMap
      name: grafana-level-values
      valuesKey: snbx.values.yaml
