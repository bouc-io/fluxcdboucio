apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-helmrelease
  namespace: external-secrets
  annotations:
    config-updated: "${CONFIG_TIMESTAMP}"
spec:
  interval: 60m
  valuesFrom:
    - kind: ConfigMap
      name: external-secrets-base-values
      valuesKey: base.values.yaml
    - kind: ConfigMap
      name: external-secrets-level-values
      valuesKey: snbx.values.yaml
