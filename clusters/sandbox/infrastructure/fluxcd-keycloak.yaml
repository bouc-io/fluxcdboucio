apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-helmrelease
  namespace: keycloak
spec:
  interval: 240m
  valuesFrom:
    - kind: ConfigMap
      name: keycloak-base-values
      valuesKey: base.values.yaml
      optional: false
    - kind: ConfigMap
      name: keycloak-level-values
      valuesKey: snbx.values.yaml
      optional: false
